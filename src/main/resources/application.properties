spring.application.name=task-manager

# ---- Database (H2, in-memory, for local dev) ----
# Switch to Postgres later by changing these 4 lines + adding the driver
# (already in pom.xml) - no code changes needed.
spring.datasource.url=jdbc:h2:mem:taskmanager
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console at http://localhost:8080/h2-console (dev only!)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JPA / Hibernate ----
# update: auto-creates/updates tables from entities - fine for learning,
# never use in a real production project (use Flyway/Liquibase migrations instead).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
# In a real project this secret comes from an environment variable, never
# committed to source control. Placeholder only - replace before using.
jwt.secret=CHANGE_ME_this_is_a_placeholder_secret_replace_before_running_in_real_use
jwt.expiration-ms=86400000

# ---- Swagger / OpenAPI ----
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
